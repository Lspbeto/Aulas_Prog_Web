<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Rede Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2 style="text-align: center; margin-bottom: 20px;">Rede Social</h2>
        
        <!-- Formulário de Login -->
        <form id="loginForm">
            <h3>Entrar</h3>
            <div style="margin-bottom: 12px; margin-top: 10px;">
                <input type="text" id="username" placeholder="Usuário" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 16px;">
                <input type="password" id="password" placeholder="Senha" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <button type="submit" style="width: 100%;">Entrar</button>
            <p style="margin-top: 15px; text-align: center; font-size: 14px;">
                Não tem uma conta? <a href="#" id="showRegister">Cadastre-se</a>
            </p>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="registerForm" style="display: none;">
            <h3>Criar Conta</h3>
            <div style="margin-bottom: 12px; margin-top: 10px;">
                <input type="text" id="regUsername" placeholder="Escolha um Usuário" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 16px;">
                <input type="password" id="regPassword" placeholder="Escolha uma Senha" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <button type="submit" style="width: 100%; background-color: #42b72a;">Cadastrar</button>
            <p style="margin-top: 15px; text-align: center; font-size: 14px;">
                Já tem uma conta? <a href="#" id="showLogin">Voltar ao Login</a>
            </p>
        </form>

        <p id="errorMsg" class="error"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
