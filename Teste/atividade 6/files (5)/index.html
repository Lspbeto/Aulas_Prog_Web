<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tarefas</title>
  <!-- CSS: aparência -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HTML: estrutura da página -->
  <main class="cartao">
    <h1>📝 Minhas Tarefas</h1>

    <form id="form-tarefa">
      <input type="text" id="campo-texto" placeholder="Digite uma tarefa..." autocomplete="off" />
      <button type="submit">Adicionar</button>
    </form>

    <p id="mensagem-erro" class="erro"></p>

    <ul id="lista"></ul>
  </main>

  <!-- JavaScript: comportamento e comunicação com o back-end -->
  <script src="script.js"></script>
</body>
</html>
